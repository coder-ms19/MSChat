# =============================================================
# Kubernetes Backend Secret – EXAMPLE / TEMPLATE
# =============================================================
# Copy this file to backend-secret.yaml and fill in real values.
#
#   cp k8/backend-secret.example.yaml k8/backend-secret.yaml
#
# backend-secret.yaml is listed in .gitignore – it will NEVER
# be committed. Only this example file is tracked by git.
# =============================================================

apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
type: Opaque
stringData:
  # PostgreSQL / Prisma connection string
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/DATABASE?sslmode=require"

  # JWT signing secrets – use long random strings in production
  JWT_ACCESS_SECRET: "change-me-access-secret"
  JWT_REFRESH_SECRET: "change-me-refresh-secret"

  # Cloudinary – https://cloudinary.com/console
  CLOUDINARY_CLOUD_NAME: "your-cloud-name"
  CLOUDINARY_API_KEY: "your-api-key"
  CLOUDINARY_API_SECRET: "your-api-secret"
  CLOUDINARY_FOLDER: "social_media_app"

  # Google OAuth – https://console.cloud.google.com
  GOOGLE_CLIENT_ID: "your-google-client-id.apps.googleusercontent.com"
  GOOGLE_CLIENT_SECRET: "your-google-client-secret"
  GOOGLE_CALLBACK_URL: "http://localhost:8080/api/auth/google/callback"

  # GitHub OAuth – https://github.com/settings/developers
  GITHUB_CLIENT_ID: "your-github-client-id"
  GITHUB_CLIENT_SECRET: "your-github-client-secret"
  GITHUB_CALLBACK_URL: "http://localhost:8080/api/auth/github/callback"

  # Frontend
  FRONTEND_URL: "http://localhost:8080"
  VITE_GOOGLE_REDIRECT_URI: "http://localhost:8080/api/auth/callback"
  VITE_GITHUB_REDIRECT_URI: "http://localhost:8080/api/auth/callback"
  FRONTEND_PORT: "8080"
