apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-frontend
  labels:
    app: nest-frontend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nest-frontend
  template:
    metadata:
      labels:
        app: nest-frontend
    spec:
      containers:
        - name: frontend
          image:  programer19/nest-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
      volumes:
        - name: nginx-config-volume
          configMap:
            name: frontend-nginx-config
